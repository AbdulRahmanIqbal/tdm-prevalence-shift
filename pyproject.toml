[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s1bench"
version = "0.1.0"
description = "When Is a System One Model Enough? Benchmark code."
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.25",
    "pyyaml>=6",
    "pandas>=2",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]
candidates = ["sentence-transformers>=3"]

[project.scripts]
s1bench = "s1bench.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
