# Exp 2: prevalence shift (spec sec 10.2). Frozen with the spec.
seed: 20261006
alphas: [10, 1, 0.1]          # Dirichlet(alpha * K * pi_s); "inf" = original test as-is is always included
draws_per_alpha: 200
coverage: 0.8                 # dev threshold for threshold transfer
em: {max_iter: 100, tol: 1.0e-6}
# Source prior for EM / oracle: trained classifiers use their train prior; zero-shot models have no
# training prior, so their implicit prior = mean predicted distribution on the dev set (spec 10.2).
source_prior:
  default: implicit
  deberta-v3-large: train
  tfidf-lr: train
# PA1-PA3 primary tests (spec 11.2). v1.1.1: B 1,000 -> 10,000 (with 1,000 the smallest non-zero two-sided p,
# 2/B = 0.002, was above Holm's first cutoff 0.05/35 = 0.0014); PA1 no-shift control is resampled.
pa:
  b: 10000
  n_priors: 50
