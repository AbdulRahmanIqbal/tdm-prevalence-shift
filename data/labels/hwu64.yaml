# Label texts for HWU64 (Liu et al. 2019; 64 intents named scenario_intent).
# STATUS: APPROVED v1.0 (2026-10-06, user approved) — FROZEN; changes only via docs/deviations.md (spec sec 5).
dataset: hwu64
task_question: "Which intent does the user's request to a home assistant express?"
source_notes: >-
  Names are the raw scenario_intent names made readable. Descriptions were written by the authors
  from the name and a few TRAINING utterances per intent (never test data); no benchmark model was
  used, and the Qwen-generated descriptions shipped with DeepPavlov/hwu64 were deliberately not used.
  Liu et al. (2019) give no official intent definitions. Known noisy/broad classes: general_quirky,
  qa_factoid (dataset_review.md). ids are the raw intent names; processing maps them to the integer
  labels of DeepPavlov/hwu64.
labels:
  - {id: "alarm_query", name: "alarm query", description: "Ask which alarms are set."}
  - {id: "alarm_remove", name: "alarm remove", description: "Delete or turn off an alarm."}
  - {id: "alarm_set", name: "alarm set", description: "Set a new alarm."}
  - {id: "audio_volume_down", name: "audio volume down", description: "Lower the volume."}
  - {id: "audio_volume_mute", name: "audio volume mute", description: "Mute the assistant or make it stay silent for a while."}
  - {id: "audio_volume_up", name: "audio volume up", description: "Raise the volume or ask the assistant to speak louder."}
  - {id: "calendar_query", name: "calendar query", description: "Ask what events or appointments are on the calendar."}
  - {id: "calendar_remove", name: "calendar remove", description: "Remove an event from the calendar."}
  - {id: "calendar_set", name: "calendar set", description: "Add an event or reminder to the calendar."}
  - {id: "cooking_recipe", name: "cooking recipe", description: "Ask for a recipe or how to cook something."}
  - {id: "datetime_convert", name: "datetime convert", description: "Convert a time between time zones."}
  - {id: "datetime_query", name: "datetime query", description: "Ask the current time or date, here or elsewhere."}
  - {id: "email_addcontact", name: "email add contact", description: "Add an email address to the contacts."}
  - {id: "email_query", name: "email query", description: "Check the inbox or ask about received emails."}
  - {id: "email_querycontact", name: "email query contact", description: "Ask for a contact's details, such as their email address."}
  - {id: "email_sendemail", name: "email send email", description: "Write, send or reply to an email."}
  - {id: "general_affirm", name: "general affirm", description: "Confirm that the assistant's response was correct."}
  - {id: "general_commandstop", name: "general command stop", description: "Tell the assistant to stop, shut up or shut down."}
  - {id: "general_confirm", name: "general confirm", description: "Ask the assistant to check or confirm what was just said."}
  - {id: "general_dontcare", name: "general dont care", description: "Say the user does not care or anything is fine."}
  - {id: "general_explain", name: "general explain", description: "Ask the assistant to explain or clarify its answer."}
  - {id: "general_joke", name: "general joke", description: "Ask for a joke."}
  - {id: "general_negate", name: "general negate", description: "Say the assistant's response was wrong or not what was wanted."}
