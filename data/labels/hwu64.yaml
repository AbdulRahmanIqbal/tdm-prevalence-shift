  - {id: "iot_coffee", name: "iot coffee", description: "Make coffee with the coffee machine."}
  - {id: "iot_hue_lightchange", name: "iot hue light change", description: "Change the color of the lights."}
  - {id: "iot_hue_lightdim", name: "iot hue light dim", description: "Dim the lights."}
