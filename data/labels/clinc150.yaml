# Label texts for CLINC150 (in-scope intents only; "oos" excluded).
# STATUS: APPROVED v1.0 (2026-10-06, user approved) — FROZEN; changes only via docs/deviations.md (spec sec 5).
dataset: clinc150
task_question: "Which intent does the user's request to a virtual assistant express?"
source_notes: >-
  Names are the raw intent names made readable (underscores -> spaces). Descriptions were written by
  the authors from the intent name and a few TRAINING utterances per intent (never test data); no
  benchmark model was used to generate them. Larson et al. (2019) give no official intent definitions.
  ids are the raw intent names; processing maps them to the integer labels of clinc/clinc_oos.
